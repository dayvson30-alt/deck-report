<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encaminhar report</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C6F79">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --ground:#EEF2F1; --surface:#FFFFFF; --ink:#0F1E1D; --muted:#4D5E5B;
  --line:#CFDAD8; --accent:#0C6F79; --wa:#1F8A4C; --crit:#A93B2C;
  --shadow:0 1px 2px rgba(15,30,29,.08), 0 8px 24px -12px rgba(15,30,29,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1211; --surface:#131C1B; --ink:#E6EFED; --muted:#9DB0AD;
    --line:#25322F; --accent:#3FBFC7; --wa:#2FA463; --crit:#E4756A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1211; --surface:#131C1B; --ink:#E6EFED; --muted:#9DB0AD;
  --line:#25322F; --accent:#3FBFC7; --wa:#2FA463; --crit:#E4756A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);
  font:16px/1.45 Barlow,-apple-system,system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:560px;margin:0 auto}
h1{font:700 24px/1.15 "Barlow Semi Condensed",sans-serif;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;
  font:14px/1.5 "IBM Plex Mono",ui-monospace,monospace}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:58px;border-radius:12px;border:0;text-decoration:none;cursor:pointer;
  padding:12px 16px;text-align:center;line-height:1.2;
  font:600 18px Barlow,sans-serif;margin-bottom:10px}
.wa{background:var(--wa);color:#fff}
.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.tip{color:var(--muted);font-size:14px;margin:6px 0 0}
.err{color:var(--crit);font-weight:600}
</style>
</head>
<body>
<main>
  <h1 id="t">Encaminhar report</h1>
  <p class="sub" id="s">Toque no botão verde e escolha a pessoa ou o setor que vai resolver.</p>
  <div class="card"><pre id="rep"></pre></div>
  <a class="btn wa" id="go" href="#">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
    <span id="goL">CLIQUE AQUI E ENVIE PARA O SETOR RESPONSÁVEL</span>
  </a>
  <button class="btn sec" id="cp" type="button">Copiar texto</button>
  <p class="tip" id="tip">Fotos: volte ao grupo, segure o dedo nas fotos do report e toque em Encaminhar. Cada foto já mostra o endereço e o problema.</p>
</main>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var text = "";
  try {
    var h = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    while (h.length % 4) h += "=";
    text = decodeURIComponent(escape(atob(h)));
  } catch(e){}

  if (!text){
    $("rep").innerHTML = '<span class="err">Link incompleto. Peça o report de novo no grupo.</span>';
    $("go").style.display = "none"; $("cp").style.display = "none";
    return;
  }

  if (!/^REPORT DO DECK/.test(text)){
    document.documentElement.lang = "en";
    document.title = "Forward report";
    $("t").textContent = "Forward report";
    $("s").textContent = "Tap the green button and pick who will fix it.";
    $("goL").textContent = "TAP HERE AND SEND TO THE RESPONSIBLE TEAM";
    $("cp").textContent = "Copy text";
    $("tip").textContent = "Photos: go back to the group, long-press the report photos and tap Forward. Each photo already shows the address and the problem.";
  }

  $("rep").textContent = text;
  $("go").href = "https://wa.me/?text=" + encodeURIComponent(text);

  $("cp").addEventListener("click", function(){
    var b = this, ok = b.textContent;
    var done = function(){ b.textContent = "✓"; setTimeout(function(){ b.textContent = ok; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){});
    }
  });
})();
</script>
</body>
</html>
